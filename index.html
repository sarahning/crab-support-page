<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dff4f8">
  <title>诶呀，我没钳了 🦀</title>
  <style>
    :root{color-scheme:light;--ink:#294b56;--sea:#dff4f8;--coral:#f16e60;--sand:#fff1d7;--outline:#793c38}
    *{box-sizing:border-box}
    body{margin:0;background:var(--sea);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    button{font:inherit;-webkit-tap-highlight-color:transparent}
    main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:35px 20px 28px;position:relative;overflow:hidden;text-align:center;isolation:isolate}
    main:before{content:"";position:absolute;z-index:-1;width:150%;height:42%;bottom:-15%;border-radius:50% 50% 0 0;background:var(--sand)}
    .stamp{font-size:12px;letter-spacing:4px;font-weight:700;opacity:.65;margin-bottom:24px}
    .bubble{position:relative;background:#fffdf7;border:2px solid var(--ink);border-radius:26px;padding:22px 32px;box-shadow:4px 5px 0 #294b5610;transform:rotate(-3deg)}
    .bubble:after{content:"";position:absolute;width:19px;height:19px;background:#fffdf7;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);bottom:-11px;left:48%;transform:rotate(45deg)}
    h1{font-family:"STKaiti","KaiTi","Microsoft YaHei",sans-serif;font-size:clamp(32px,7vw,52px);letter-spacing:2px;margin:0;font-weight:900;line-height:1.25}
    .pun{position:relative;color:#df5e53}.pun:after{content:"";height:3px;background:#df5e53;position:absolute;bottom:-5px;left:1px;right:1px;border-radius:50%;transform:rotate(-5deg)}
    .scene{width:min(440px,100%);margin:12px 0 -2px;position:relative}
    svg{width:100%;height:auto;display:block;overflow:visible}
    .crab{transform-origin:220px 230px;animation:breathe 2.8s ease-in-out infinite}
    .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
    .lost{transform-origin:108px 282px;animation:wobble 3.5s ease-in-out infinite}
    .tear{animation:tear 2.8s infinite}
    .tag{font-size:12px;fill:#64818a;letter-spacing:1px}
    .copy{font-size:15px;line-height:1.9;margin:0 0 24px;color:#52717a}
    .copy strong{font-weight:500;color:var(--ink)}
    .primary{border:2px solid var(--ink);background:var(--coral);color:#fffdf7;border-radius:100px;padding:15px 28px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .15s,box-shadow .15s;position:relative}
    .primary:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
    .primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
    button:focus-visible{outline:3px solid #187b99;outline-offset:7px}
    .small{margin:19px 0 0;font-size:12px;color:#68828a}
    .reset{margin-top:13px;border:0;background:none;color:#52717a;text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:12px}
    .attached{opacity:0;transition:opacity .65s .15s}.happy .attached{opacity:1}.happy .lost,.happy .tear,.happy .lost-label,.happy .sad-mouth{opacity:0}.smile{opacity:0}.happy .smile{opacity:1}
    .lost{transition:opacity .4s,translate .6s,rotate .6s}.happy .lost{translate:0 -110px;rotate:25deg}
    dialog{width:min(370px,calc(100% - 36px));max-height:calc(100svh - 36px);overflow:auto;padding:32px 25px 28px;border:2px solid var(--ink);border-radius:28px;background:#fffdf7;color:var(--ink);text-align:center;box-shadow:7px 8px 0 #294b5626}
    dialog::backdrop{background:#294b5677;backdrop-filter:blur(5px)}
    dialog h2{font-size:23px;margin:4px 0 8px}dialog p{font-size:14px;color:#52717a;line-height:1.7;margin:8px 0 20px}
    .close{position:absolute;right:12px;top:9px;border:0;background:none;font-size:26px;color:#68828a;cursor:pointer;padding:2px 7px}
    .qr-box{width:min(238px,100%);margin:20px auto 24px;border:2px dashed #b8d4d8;border-radius:16px;background:white;overflow:hidden}
    .qr-box svg{display:block;width:100%;height:auto}
    dialog .primary{width:100%}dialog .hint{font-size:11px;margin:17px 0 0}
    .happy .crab{animation:celebrate .65s ease-in-out 3,breathe 2.8s 2s ease-in-out infinite}
    .sparkle{position:absolute;font-size:24px;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
    footer{margin-top:40px;font-size:11px;color:#78939a;letter-spacing:2px}
    @keyframes breathe{50%{transform:translateY(-5px) rotate(1deg)}}
    @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
    @keyframes wobble{0%,75%,100%{transform:rotate(0)}80%{transform:rotate(-6deg)}86%{transform:rotate(5deg)}92%{transform:rotate(-3deg)}}
    @keyframes tear{0%,15%{opacity:0;transform:translateY(-5px)}30%,70%{opacity:1}95%,100%{opacity:0;transform:translateY(12px)}}
    @keyframes celebrate{50%{transform:translateY(-17px) rotate(-4deg)}}
    @keyframes floatUp{to{transform:translate(var(--x),-150px) rotate(30deg);opacity:0}}
    @media(max-height:750px){main{padding-top:24px}.stamp{margin-bottom:16px}.scene{width:min(350px,90vw)}footer{margin-top:26px}.bubble{padding:17px 25px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>

  <button class="primary" id="fed" type="button">已投喂，捡起钳子 ♡</button>
  <p class="hint">投喂后点一下，小螃蟹就能捡起钳子啦。</p>
</dialog>
<script>
  const page=document.getElementById('page'),button=document.getElementById('support'),headline=document.getElementById('headline'),copy=document.getElementById('copy'),note=document.getElementById('note'),reset=document.getElementById('reset'),title=document.getElementById('crab-title');
  const payment=document.getElementById('payment');
  button.addEventListener('click',()=>payment.showModal());
  document.getElementById('close-payment').addEventListener('click',()=>payment.close());
  payment.addEventListener('click',event=>{if(event.target===payment){const box=payment.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)payment.close();}});
  document.getElementById('fed').addEventListener('click',()=>{
    payment.close();
    page.classList.add('happy');
    headline.textContent='有钳了，谢谢你！';
    copy.innerHTML='收到你的投喂心意啦。<br><strong>小螃蟹又可以横着走了！</strong>';
    note.textContent='蟹蟹你的投喂，今天也要开心呀 ♡';
    title.textContent='小螃蟹重新举起钳子，开心地笑了';
    button.textContent='再给你一个蟹蟹 ♡';reset.hidden=false;
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
      for(let i=0;i<7;i++){const heart=document.createElement('span');heart.className='sparkle';heart.textContent=['♡','✦','♥'][i%3];heart.style.cssText=`left:calc(50% + ${(i-3)*25}px);top:66%;color:${i%2?'#f16e60':'#559eaf'};--x:${(i-3)*18}px;animation-delay:${i*.05}s`;page.appendChild(heart);setTimeout(()=>heart.remove(),1800);}
    }
  });
  reset.addEventListener('click',()=>{
    page.classList.remove('happy');headline.innerHTML='诶呀，我没<span class="pun">钳</span>了';copy.innerHTML='钳子掉了，钱包也空了。<br><strong>这只小螃蟹，想申请一点生活费。</strong>';note.textContent='一点点投喂，就能满血复活 ♡';button.textContent='支援一点生活费 ↗';title.textContent='一只委屈的卡通小螃蟹，钳子掉在沙滩上';reset.hidden=true;button.focus();
  });
</script>
